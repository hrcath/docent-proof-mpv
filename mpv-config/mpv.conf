# Docent-Proof MPV - mpv settings (kiosk mode)

# Full-screen window that never closes on its own
fullscreen=yes
force-window=yes
idle=yes
keep-open=no
border=no
title=Docent-Proof MPV

# Images stay up until the clicker is pressed
image-display-duration=inf

# No on-screen controls, no mouse cursor, no stray keyboard shortcuts
osc=no
osd-bar=no
input-default-bindings=no
cursor-autohide=always

# Keep the screen awake while the player is running
stop-screensaver=always

# Lighter startup
ytdl=no
load-stats-overlay=no

# Hardware video decoding when available
hwdec=auto-safe

# Volume 0-100 (adjust to the room)
volume=100

# Diagnostics: overwritten on every start
log-file=~~/mpv.log
