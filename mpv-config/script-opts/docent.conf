# Docent-Proof MPV script options
# Remove the leading # from a line to change that setting, then restart the player.
#
# Keys use mpv key names. Press Ctrl+K on the player screen to see the name of
# any key or clicker button. Separate several keys with commas.
#next_keys=PGDWN,RIGHT,DOWN,SPACE,ENTER,KP_ENTER,MBTN_LEFT
#back_keys=PGUP,LEFT,UP
#
# How often (seconds) to check for a newly chosen screen image while it is showing.
#poll_seconds=3
#
# The media folder is set by DOCENT_FOLDER in start-docent.bat.
